name: apply-operator-upgrade

on:
  push:
    branches:
      - codex/tui-observability-oauth-dspy

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v6
      - name: Install Python 3.14 and development dependencies
        run: uv sync --extra dev --python 3.14
      - name: Apply operator upgrade
        run: uv run --python 3.14 python scripts/apply_operator_upgrade.py
      - name: Normalize generated Python
        run: uv run --python 3.14 ruff check --fix src tests
      - name: Focused operator, OAuth, DSPy, and context tests
        run: >-
          uv run --python 3.14 pytest -q
          tests/scenarios/test_observability.py
          tests/scenarios/test_operator_upgrade.py
          tests/scenarios/test_interface_regressions.py
          tests/scenarios/test_user_cli.py
          tests/scenarios/test_oauth.py
          tests/scenarios/test_oauth_wiring.py
          tests/scenarios/test_optimize.py
          tests/scenarios/test_optimize_exception_hygiene.py
          tests/scenarios/test_context_epochs.py
      - name: Ruff
        run: uv run --python 3.14 ruff check src tests
      - name: Fast test tier
        run: uv run --python 3.14 pytest -q -n auto
      - name: Slow test tier
        run: uv run --python 3.14 pytest -q -n auto -m slow
      - name: CLI smoke tests
        run: |
          uv run --python 3.14 cambium monitor --help
          uv run --python 3.14 cambium-monitor --help
          uv run --python 3.14 cambium optimize should_decompose --dry-run
      - name: Compile and whitespace checks
        run: |
          uv run --python 3.14 python -m compileall -q src tests
          git diff --check
      - name: Commit verified implementation
        run: |
          git config user.name "cambium-operator-bot"
          git config user.email "cambium-operator-bot@users.noreply.github.com"
          git add -- README.md pyproject.toml src/cambium tests/scenarios docs
          git rm -- scripts/apply_operator_upgrade.py .github/workflows/apply-operator-upgrade.yml
          git commit -m "feat(ui): add event-sourced operator dashboard"
          git push origin HEAD
