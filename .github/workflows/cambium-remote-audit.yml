name: cambium-remote-audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cambium-remote-audit-main
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' || python -m pip install -e .
          python -m pip install pytest pytest-asyncio ruff

      - name: Run deterministic repair and checks
        id: checks
        shell: bash
        run: |
          set +e
          mkdir -p .audit

          ruff check --fix . >.audit/ruff-check.log 2>&1
          ruff_check=$?

          ruff format . >.audit/ruff-format.log 2>&1
          ruff_format=$?

          python -m compileall -q src tests >.audit/compile.log 2>&1
          compile=$?

          python -m pytest -q \
            tests/scenarios/test_delegate_schema.py \
            tests/scenarios/test_prompts.py \
            >.audit/focused-tests.log 2>&1
          focused=$?

          python -m pytest -q -m 'not slow' >.audit/fast-tests.log 2>&1
          fast=$?

          printf 'ruff_check=%s\nruff_format=%s\ncompile=%s\nfocused=%s\nfast=%s\n' \
            "$ruff_check" "$ruff_format" "$compile" "$focused" "$fast" \
            >.audit/status.env

          cat .audit/status.env
          test "$ruff_check" -eq 0 \
            -a "$ruff_format" -eq 0 \
            -a "$compile" -eq 0 \
            -a "$focused" -eq 0 \
            -a "$fast" -eq 0

      - name: Publish failure evidence
        if: failure() && steps.checks.outcome == 'failure'
        shell: bash
        run: |
          git config user.name 'cambium-audit'
          git config user.email 'cambium-audit@users.noreply.github.com'
          mkdir -p artifacts/verification
          cp .audit/status.env artifacts/verification/latest-status.env
          for log in .audit/*.log; do
            tail -n 400 "$log" >"artifacts/verification/$(basename "$log")"
          done
          git add artifacts/verification
          git commit -m 'test: record failing repository audit [skip audit]' || true
          git push --force origin HEAD:refs/heads/audit/latest-failure

      - name: Publish verified result and repairs
        if: success()
        shell: bash
        run: |
          git config user.name 'cambium-audit'
          git config user.email 'cambium-audit@users.noreply.github.com'
          mkdir -p artifacts/verification
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          tested = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          payload = {
              'status': 'passed',
              'tested_commit': tested,
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'checks': {
                  'ruff_check_fix': 'passed',
                  'ruff_format': 'passed',
                  'compileall': 'passed',
                  'focused_delegate_and_prompt_tests': 'passed',
                  'pytest_not_slow': 'passed',
              },
          }
          Path('artifacts/verification/latest.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          git add -A
          git commit -m 'test: publish verified repository state [skip audit]'
          git pull --rebase origin main
          git push origin HEAD:main
