name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Python 3.14 is a stable setup-python build for ubuntu-24.04
      # (actions/python-versions manifest: 3.14.7 linux-24.04-x64). Fallback:
      # install 3.14 from the deadsnakes PPA (`apt-get install python3.14`)
      # and prepend /usr/bin to PATH if setup-python stops shipping it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Ensure python3.14 is on PATH
        run: |
          if ! command -v python3.14 >/dev/null 2>&1; then
            ln -sf "$(command -v python3)" "$RUNNER_TEMP/python3.14"
            echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          fi
          python3.14 --version

      - name: Install project with test extras
        run: python3.14 -m pip install -q -e '.[test]'

      - name: Syntax and import gates
        run: |
          python3.14 -m compileall -q src
          python3.14 -c "import cambium"

      - name: Fast-tier tests
        run: python3.14 -m pytest tests/scenarios -q -p no:cacheprovider

      # e2e-selfcheck.sh is self-contained (bash, git, python3.14) and clones
      # /home/ubuntu/cambium as the repository under test; the harness runs
      # from this checkout's src. The clone source path is host-specific by
      # design and left untouched.
      - name: End-to-end self-check
        run: bash scripts/e2e-selfcheck.sh
