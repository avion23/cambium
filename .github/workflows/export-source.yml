name: export-source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Archive exact checkout
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/cambium-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: cambium-source
          path: ${{ runner.temp }}/cambium-source.tar.gz
          if-no-files-found: error
          retention-days: 1
