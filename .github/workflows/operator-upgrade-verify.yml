name: operator-upgrade-verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: astral-sh/setup-uv@v6
      - name: Install Python 3.14 and development dependencies
        run: uv sync --extra dev --python 3.14
      - name: Adapt generator to latest upstream UI
        run: uv run --python 3.14 python scripts/adapt_operator_upgrade_latest.py prepare
      - name: Apply implementation against latest main
        run: uv run --python 3.14 python scripts/apply_operator_upgrade.py
      - name: Preserve latest upstream UI behavior
        run: uv run --python 3.14 python scripts/adapt_operator_upgrade_latest.py finalize
      - name: Apply focused compatibility corrections
        run: uv run --python 3.14 python scripts/fix_operator_upgrade_tests.py
      - name: Normalize Python
        run: uv run --python 3.14 ruff check --fix src tests
      - name: Removed documentation has no surviving references
        run: |
          uv run --python 3.14 python - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          deleted = [
              Path(line)
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only", "--diff-filter=D", "--", "docs"],
                  text=True,
              ).splitlines()
              if line.strip()
          ]
          excluded = {
              Path("scripts/apply_operator_upgrade.py"),
              Path("scripts/adapt_operator_upgrade_latest.py"),
              Path("scripts/fix_operator_upgrade_tests.py"),
              Path(".github/workflows/operator-upgrade-verify.yml"),
          }
          searchable = []
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              relative = path.relative_to(root)
              if relative in excluded or any(part in {".git", ".venv"} for part in relative.parts):
                  continue
              if relative.suffix not in {".md", ".py", ".toml", ".yml", ".yaml", ".json"}:
                  continue
              searchable.append(relative)

          failures = []
          for removed in deleted:
              needles = {removed.as_posix(), removed.name}
              for candidate in searchable:
                  try:
                      text = (root / candidate).read_text(encoding="utf-8")
                  except (OSError, UnicodeError):
                      continue
                  hits = sorted(needle for needle in needles if needle in text)
                  if hits:
                      failures.append((removed.as_posix(), candidate.as_posix(), hits))
          if failures:
              for removed, candidate, hits in failures:
                  print(f"stale reference: {candidate} -> {removed} via {hits}")
              raise SystemExit(1)
          print(f"checked {len(deleted)} removed docs across {len(searchable)} surviving files")
          PY
      - name: Ruff
        run: uv run --python 3.14 ruff check src tests
      - name: Compile
        run: uv run --python 3.14 python -m compileall -q src tests
      - name: Focused operator, OAuth, DSPy, and context tests
        run: >-
          uv run --python 3.14 pytest -q
          tests/scenarios/test_observability.py
          tests/scenarios/test_operator_upgrade.py
          tests/scenarios/test_interface_regressions.py
          tests/scenarios/test_user_cli.py
          tests/scenarios/test_oauth.py
          tests/scenarios/test_oauth_wiring.py
          tests/scenarios/test_optimize.py
          tests/scenarios/test_optimize_exception_hygiene.py
          tests/scenarios/test_context_epochs.py
          tests/scenarios/test_render_stream.py
          tests/scenarios/test_render_markdown.py
      - name: Fast test tier
        run: uv run --python 3.14 pytest -q -n auto
      - name: Slow test tier
        run: uv run --python 3.14 pytest -q -n auto -m slow
      - name: CLI and lock smoke tests
        run: |
          uv lock --check
          uv run --python 3.14 cambium monitor --help
          uv run --python 3.14 cambium-monitor --help
          uv run --python 3.14 cambium optimize should_decompose --dry-run
      - name: Whitespace
        run: git diff --check
      - name: Commit verified implementation
        run: |
          git config user.name "cambium-operator-bot"
          git config user.email "cambium-operator-bot@users.noreply.github.com"
          git add -- README.md pyproject.toml uv.lock src/cambium tests/scenarios docs
          git rm -f -- \
            scripts/apply_operator_upgrade.py \
            scripts/adapt_operator_upgrade_latest.py \
            scripts/fix_operator_upgrade_tests.py \
            .github/workflows/operator-upgrade-verify.yml
          git diff --cached --check
          git commit -m "feat(ui): add event-sourced operator dashboard"
          git push origin HEAD
