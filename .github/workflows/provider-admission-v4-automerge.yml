name: provider-admission-v4-automerge

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-publish-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: astral-sh/setup-uv@v6
      - name: Install Python 3.14 and development dependencies
        run: uv sync --extra dev --python 3.14
      - name: Apply provider admission upgrade
        run: uv run --python 3.14 python scripts/apply_provider_admission_v4.py
      - name: Normalize generated Python
        run: uv run --python 3.14 ruff check --fix src tests
      - name: Static gates
        run: |
          uv run --python 3.14 ruff check src tests
          uv run --python 3.14 python -m compileall -q src tests
          uv lock --check
          git diff --check
      - name: Focused routing, quota, supervisor, OAuth, context, and UI gates
        run: >-
          uv run --python 3.14 pytest -q
          tests/scenarios/test_provider_admission_v4.py
          tests/scenarios/test_lane_mailbox_source.py
          tests/scenarios/test_provider_scheduler.py
          tests/scenarios/test_production_harness_v3.py
          tests/scenarios/test_provider_config.py
          tests/scenarios/test_diffundo.py
          tests/scenarios/test_diffundo_ordering.py
          tests/scenarios/test_routing.py
          tests/scenarios/test_supervisor_context_events.py
          tests/scenarios/test_oauth.py
          tests/scenarios/test_oauth_wiring.py
          tests/scenarios/test_context_epochs.py
          tests/scenarios/test_interface_regressions.py
          tests/scenarios/test_render_stream.py
      - name: Complete fast tier
        run: uv run --python 3.14 pytest -q -n auto
      - name: Complete slow tier
        run: uv run --python 3.14 pytest -q -n auto -m slow
      - name: Operator smoke gates
        run: |
          uv run --python 3.14 cambium --help
          uv run --python 3.14 cambium quota --help
          uv run --python 3.14 cambium quota status --json
          uv run --python 3.14 cambium-quota --help
          uv run --python 3.14 cambium monitor --help
          uv run --python 3.14 cambium optimize should_decompose --dry-run
      - name: Publish verified implementation
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "cambium-admission-bot"
          git config user.email "cambium-admission-bot@users.noreply.github.com"
          git add -- README.md docs src tests pyproject.toml uv.lock
          git rm -f --ignore-unmatch -- \
            scripts/apply_provider_admission_v4.py \
            .github/workflows/provider-admission-v4-automerge.yml
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "feat(routing): wire quota pacing and lane admission mailbox"
            git push origin HEAD:"$BRANCH"
          fi
      - name: Squash merge verified pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          gh api --method PUT "repos/$REPO/pulls/$PR/merge" \
            -f merge_method=squash \
            -f sha="$HEAD_SHA" \
            -f commit_title="feat(routing): quota-paced provider admission" \
            -f commit_message="Add independent subscription-window pacing, a single-writer provider-lane mailbox, quota observation commands, durable quota introspection, and dashboard visibility while preserving strict root provider leases and independent cold-subagent routing."
