name: rebase-review

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/cambium-correctness-docs-20260823

permissions:
  contents: write

jobs:
  rebase-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/cambium-correctness-docs-20260823
          fetch-depth: 0
      - name: Reset staging and pull-rebase main
        run: |
          git config user.name "openai-codex"
          git config user.email "codex@openai.com"
          expected_remote_head="$(git rev-parse origin/codex/cambium-correctness-docs-20260823)"
          test "$(git rev-parse HEAD)" = "$expected_remote_head"
          echo "EXPECTED_REMOTE_HEAD=$expected_remote_head" >> "$GITHUB_ENV"
          git reset --hard 1596385148fe022102cabc67dd795a04f97d0045
          git pull --rebase origin main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Refresh and install lock
        run: |
          uv lock
          uv sync --locked --extra dev
          if ! git diff --quiet -- uv.lock; then
            git add uv.lock
            git commit -m "build: refresh lock after rebase"
          fi
      - name: Ruff
        run: uv run ruff check src tests
      - name: Compile
        run: uv run python -m compileall -q src tests
      - name: Fast tests
        run: uv run pytest -n auto -q
      - name: Slow tests
        run: uv run pytest -n auto -m slow -q
      - name: Publish rebased branch
        run: >-
          git push
          --force-with-lease=refs/heads/codex/cambium-correctness-docs-20260823:${EXPECTED_REMOTE_HEAD}
          origin HEAD:refs/heads/codex/cambium-correctness-docs-20260823
