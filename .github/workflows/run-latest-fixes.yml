name: run-latest-fixes

on:
  push:
    branches:
      - codex/fix-latest-regressions-20260829
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.event_name == 'pull_request' ||
      github.event.head_commit.message == 'chore: trigger latest regression runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-latest-regressions-20260829
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply patch
        run: python .github/apply-latest-fixes.py

      - name: Install focused test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . 'pytest>=9' 'ruff>=0.12,<0.15'

      - name: Check formatting and syntax
        run: |
          python -m compileall -q src tests/scenarios
          ruff check \
            src/cambium/oneshot.py \
            src/cambium/worker.py \
            src/cambium/schemas.py \
            tests/scenarios/test_oneshot_branch.py \
            tests/scenarios/test_gap_premature_finish.py \
            tests/scenarios/test_delegate_schema.py
          ruff format --check \
            src/cambium/oneshot.py \
            src/cambium/worker.py \
            src/cambium/schemas.py \
            tests/scenarios/test_oneshot_branch.py \
            tests/scenarios/test_gap_premature_finish.py \
            tests/scenarios/test_delegate_schema.py

      - name: Run focused regressions
        run: |
          python -m pytest -q -o addopts='' \
            tests/scenarios/test_oneshot_branch.py \
            tests/scenarios/test_gap_premature_finish.py \
            tests/scenarios/test_delegate_schema.py
          python -m pytest -q -o addopts='' -m 'not slow' \
            tests/scenarios/test_worker_agent_loop.py \
            tests/scenarios/test_worker_provider.py \
            tests/scenarios/test_supervisor_delegation_contracts.py

      - name: Commit tested patch
        run: |
          git config user.name 'cambium-fix-bot'
          git config user.email 'cambium-fix-bot@users.noreply.github.com'
          git add \
            src/cambium/oneshot.py \
            src/cambium/worker.py \
            src/cambium/schemas.py \
            tests/scenarios/test_oneshot_branch.py \
            tests/scenarios/test_gap_premature_finish.py \
            tests/scenarios/test_delegate_schema.py
          git diff --cached --check
          git commit -m 'fix: align completion and publication contracts'
          git push origin HEAD:codex/fix-latest-regressions-20260829
