name: runtime-v2-apply-v3

on:
  push:
    branches:
      - codex/runtime-resource-actor
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/runtime-resource-actor
      - name: Preserve materializer
        run: |
          cp scripts/runtime_v2_apply.py /tmp/runtime_v2_apply.py
          cp scripts/fix_runtime_resource_actor.py /tmp/fix_runtime_resource_actor.py
      - name: Pull latest upstream main
        run: |
          git fetch origin main
          echo "BASE_SHA=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          git checkout --detach origin/main
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --python 3.14
      - name: Normalize materializer
        run: |
          python /tmp/fix_runtime_resource_actor.py normalize /tmp/runtime_v2_apply.py
          python -m py_compile \
            /tmp/runtime_v2_apply.py \
            /tmp/fix_runtime_resource_actor.py
      - name: Apply and validate
        run: |
          cp /tmp/runtime_v2_apply.py scripts/runtime_v2_apply.py
          uv run --python 3.14 python scripts/runtime_v2_apply.py
          python /tmp/fix_runtime_resource_actor.py pre .
          uv lock
          uv sync --extra dev --python 3.14
          uv run --python 3.14 ruff format src tests
          uv run --python 3.14 ruff check --fix --unsafe-fixes --exit-zero src tests
          python /tmp/fix_runtime_resource_actor.py post .
          uv run --python 3.14 ruff format src tests
          uv run --python 3.14 ruff check src tests
          uv run --python 3.14 python -m compileall -q src tests
          uv run --python 3.14 pytest -q \
            tests/scenarios/test_provider_resources.py \
            tests/scenarios/test_selection.py \
            tests/scenarios/test_oauth.py \
            tests/scenarios/test_oauth_wiring.py \
            tests/scenarios/test_interface_regressions.py \
            tests/scenarios/test_render_stream.py \
            tests/scenarios/test_user_cli.py
          uv run --python 3.14 pytest -q -n auto
          uv run --python 3.14 pytest -q -n auto -m slow
          uv lock --check
          uv run --python 3.14 cambium-quota --help
          git diff --check
      - name: Commit and safe fast-forward
        run: |
          rm -f scripts/runtime_v2_apply.py
          git config user.name "cambium-runtime-bot"
          git config user.email "cambium-runtime-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(runtime): add quota-aware provider portfolio"
          git push --force-with-lease=refs/heads/main:${BASE_SHA} origin HEAD:main
