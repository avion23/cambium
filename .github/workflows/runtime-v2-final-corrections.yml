name: runtime-v2-final-corrections

on:
  push:
    branches:
      - codex/runtime-v2-final-corrections

permissions:
  contents: write

jobs:
  verify-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/runtime-v2-final-corrections
      - run: cp scripts/apply_runtime_final_corrections.py /tmp/apply_runtime_final_corrections.py

      - name: Wait for productized runtime on latest main
        run: |
          for attempt in $(seq 1 120); do
            git fetch origin main
            BASE_SHA=$(git rev-parse origin/main)
            if git cat-file -e "$BASE_SHA:tests/scenarios/test_provider_resources_productization.py" 2>/dev/null; then
              echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
              git checkout --detach "$BASE_SHA"
              exit 0
            fi
            sleep 15
          done
          echo "productized runtime did not arrive on main" >&2
          exit 1

      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --python 3.14

      - name: Apply final scheduler and telemetry corrections
        run: |
          cp /tmp/apply_runtime_final_corrections.py scripts/apply_runtime_final_corrections.py
          uv run --python 3.14 python scripts/apply_runtime_final_corrections.py
          uv lock
          uv sync --extra dev --python 3.14
          uv run --python 3.14 ruff check --fix src tests
          uv run --python 3.14 ruff check src tests
          uv run --python 3.14 python -m compileall -q src tests

      - name: Focused end-to-end runtime tests
        run: >-
          uv run --python 3.14 pytest -q
          tests/scenarios/test_provider_portfolio_e2e.py
          tests/scenarios/test_oauth_refresh_singleflight.py
          tests/scenarios/test_provider_resources_productization.py
          tests/scenarios/test_provider_resources_hardening.py
          tests/scenarios/test_provider_resources.py
          tests/scenarios/test_provider_resource_commands.py
          tests/scenarios/test_interactive_session.py
          tests/scenarios/test_selection.py
          tests/scenarios/test_oauth.py
          tests/scenarios/test_oauth_wiring.py
          tests/scenarios/test_context_epochs.py
          tests/scenarios/test_user_cli.py

      - name: Complete test and operator gates
        run: |
          uv run --python 3.14 pytest -q -n auto
          uv run --python 3.14 pytest -q -n auto -m slow
          uv lock --check
          tmp=$(mktemp -d)
          cat > "$tmp/status.py" <<'PY'
          import json
          print(json.dumps({
              "tokens_per_second": 55,
              "windows": [
                  {"name": "5h", "remaining_tokens": 1000, "limit_tokens": 2000, "resets_at": 1999999999},
                  {"name": "week", "remaining_tokens": 5000, "limit_tokens": 10000, "resets_at": 1999999999},
              ],
          }))
          PY
          uv run --python 3.14 cambium-quota init --path "$tmp/resources.json"
          uv run --python 3.14 cambium-quota poll codex --path "$tmp/resources.json" -- python "$tmp/status.py"
          uv run --python 3.14 cambium-quota recommend --path "$tmp/resources.json" --task-class main --role main --incumbent codex
          git diff --check

      - name: Commit and lease-protected fast-forward
        run: |
          rm -f scripts/apply_runtime_final_corrections.py
          git config user.name "cambium-runtime-bot"
          git config user.email "cambium-runtime-bot@users.noreply.github.com"
          git add -A
          git commit -m "fix(runtime): make affinity quota-feasible and status-driven"
          git push --force-with-lease=refs/heads/main:${BASE_SHA} origin HEAD:main
