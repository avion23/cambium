name: runtime-v2-hardening

on:
  push:
    branches:
      - codex/runtime-v2-hardening

permissions:
  contents: write

jobs:
  verify-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/runtime-v2-hardening
      - run: cp scripts/apply_runtime_hardening.py /tmp/apply_runtime_hardening.py

      - name: Wait for the consolidated runtime on latest main
        run: |
          for attempt in $(seq 1 80); do
            git fetch origin main
            BASE_SHA=$(git rev-parse origin/main)
            if git cat-file -e "$BASE_SHA:src/cambium/provider_resources.py" 2>/dev/null \
              && git cat-file -e "$BASE_SHA:src/cambium/interactive.py" 2>/dev/null \
              && git show "$BASE_SHA:src/cambium/interactive.py" | grep -q CAMBIUM_LOCAL_COMMANDS; then
              echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
              git checkout --detach "$BASE_SHA"
              exit 0
            fi
            sleep 15
          done
          echo "consolidated runtime did not arrive on main" >&2
          exit 1

      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --python 3.14

      - name: Apply policy hardening
        run: |
          cp /tmp/apply_runtime_hardening.py scripts/apply_runtime_hardening.py
          uv run --python 3.14 python scripts/apply_runtime_hardening.py
          uv lock
          uv sync --extra dev --python 3.14
          uv run --python 3.14 ruff check --fix src tests
          uv run --python 3.14 ruff check src tests
          uv run --python 3.14 python -m compileall -q src tests

      - name: Focused policy, OAuth, tool, and UI tests
        run: >-
          uv run --python 3.14 pytest -q
          tests/scenarios/test_provider_resources.py
          tests/scenarios/test_provider_resource_commands.py
          tests/scenarios/test_provider_resources_hardening.py
          tests/scenarios/test_selection.py
          tests/scenarios/test_oauth.py
          tests/scenarios/test_oauth_wiring.py
          tests/scenarios/test_interactive_session.py
          tests/scenarios/test_context_epochs.py
          tests/scenarios/test_user_cli.py

      - name: Complete test tiers and smoke
        run: |
          uv run --python 3.14 pytest -q -n auto
          uv run --python 3.14 pytest -q -n auto -m slow
          uv lock --check
          uv run --python 3.14 cambium-quota recommend --task-class research
          git diff --check

      - name: Commit and lease-protected fast-forward
        run: |
          rm -f scripts/apply_runtime_hardening.py
          git config user.name "cambium-runtime-bot"
          git config user.email "cambium-runtime-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(runtime): harden provider resource scheduling"
          git push --force-with-lease=refs/heads/main:${BASE_SHA} origin HEAD:main
