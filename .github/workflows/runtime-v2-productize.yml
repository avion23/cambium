name: runtime-v2-productize

on:
  push:
    branches:
      - codex/runtime-v2-productize

permissions:
  contents: write

jobs:
  verify-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/runtime-v2-productize
      - run: cp scripts/apply_runtime_productization.py /tmp/apply_runtime_productization.py

      - name: Wait for hardened runtime on latest main
        run: |
          for attempt in $(seq 1 100); do
            git fetch origin main
            BASE_SHA=$(git rev-parse origin/main)
            if git cat-file -e "$BASE_SHA:tests/scenarios/test_provider_resources_hardening.py" 2>/dev/null; then
              echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
              git checkout --detach "$BASE_SHA"
              exit 0
            fi
            sleep 15
          done
          echo "hardened runtime did not arrive on main" >&2
          exit 1

      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --python 3.14

      - name: Apply operator productization
        run: |
          cp /tmp/apply_runtime_productization.py scripts/apply_runtime_productization.py
          uv run --python 3.14 python scripts/apply_runtime_productization.py
          uv lock
          uv sync --extra dev --python 3.14
          uv run --python 3.14 ruff check --fix src tests
          uv run --python 3.14 ruff check src tests
          uv run --python 3.14 python -m compileall -q src tests

      - name: Focused product and runtime tests
        run: >-
          uv run --python 3.14 pytest -q
          tests/scenarios/test_provider_resources_productization.py
          tests/scenarios/test_provider_resources_hardening.py
          tests/scenarios/test_provider_resources.py
          tests/scenarios/test_provider_resource_commands.py
          tests/scenarios/test_interactive_session.py
          tests/scenarios/test_oauth.py
          tests/scenarios/test_oauth_wiring.py
          tests/scenarios/test_user_cli.py
          tests/scenarios/test_context_epochs.py

      - name: Full gates and operator smoke
        run: |
          uv run --python 3.14 pytest -q -n auto
          uv run --python 3.14 pytest -q -n auto -m slow
          uv lock --check
          tmp=$(mktemp -d)
          uv run --python 3.14 cambium-quota init --path "$tmp/resources.json"
          uv run --python 3.14 cambium-quota validate --path "$tmp/resources.json"
          uv run --python 3.14 cambium-quota recommend --path "$tmp/resources.json" --task-class research
          uv run --python 3.14 cambium monitor --help
          git diff --check

      - name: Commit and lease-protected fast-forward
        run: |
          rm -f scripts/apply_runtime_productization.py
          git config user.name "cambium-runtime-bot"
          git config user.email "cambium-runtime-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(runtime): productize persistent provider-aware sessions"
          git push --force-with-lease=refs/heads/main:${BASE_SHA} origin HEAD:main
