name: materialize-tool-runtime-v5

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/tool-runtime-v5
      - name: Preserve integration scripts
        run: |
          cp scripts/apply_tool_runtime_v5.py /tmp/apply_tool_runtime_v5.py
          cp scripts/fix_tool_runtime_v5.py /tmp/fix_tool_runtime_v5.py
          cp scripts/patch_tool_runtime_v5_for_main.py /tmp/patch_tool_runtime_v5_for_main.py
      - name: Start from latest clean main
        run: |
          git fetch origin main
          echo "BASE_SHA=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          git checkout --detach origin/main
          mkdir -p scripts
          cp /tmp/apply_tool_runtime_v5.py scripts/apply_tool_runtime_v5.py
          cp /tmp/fix_tool_runtime_v5.py scripts/fix_tool_runtime_v5.py
          cp /tmp/patch_tool_runtime_v5_for_main.py scripts/patch_tool_runtime_v5_for_main.py
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --python 3.14
      - name: Apply immutable hybrid tool runtime
        run: |
          uv run --python 3.14 python scripts/patch_tool_runtime_v5_for_main.py
          uv run --python 3.14 python scripts/apply_tool_runtime_v5.py
          uv run --python 3.14 python scripts/fix_tool_runtime_v5.py
          uv run --python 3.14 ruff format src tests
          uv run --python 3.14 ruff check --fix --unsafe-fixes --exit-zero src tests
          uv run --python 3.14 ruff format src tests
      - name: Static gates
        run: |
          uv lock --check
          uv run --python 3.14 ruff check src tests
          uv run --python 3.14 python -m compileall -q src tests
          git diff --check
      - name: Focused integration gates
        run: |
          uv run --python 3.14 pytest -q \
            tests/scenarios/test_tool_runtime_v5.py \
            tests/scenarios/test_tool_runtime_source_v5.py \
            tests/scenarios/test_provider_admission_v4.py \
            tests/scenarios/test_lane_mailbox_source.py \
            tests/scenarios/test_provider_scheduler.py \
            tests/scenarios/test_production_harness_v3.py \
            tests/scenarios/test_provider_config.py \
            tests/scenarios/test_diffundo.py \
            tests/scenarios/test_diffundo_ordering.py \
            tests/scenarios/test_oauth.py \
            tests/scenarios/test_oauth_wiring.py \
            tests/scenarios/test_context_epochs.py \
            tests/scenarios/test_interface_regressions.py \
            tests/scenarios/test_user_cli.py \
            tests/scenarios/test_render_stream.py
      - name: Complete fast tier
        run: uv run --python 3.14 pytest -q -n auto
      - name: Complete slow tier
        run: uv run --python 3.14 pytest -q -n auto -m slow
      - name: Operator smoke
        run: |
          uv run --python 3.14 cambium --help
          uv run --python 3.14 cambium run --help | grep -- --allow-python
          uv run --python 3.14 cambium quota --help
          uv run --python 3.14 cambium monitor --help
      - name: Publish verified implementation to main
        run: |
          rm -f \
            scripts/apply_tool_runtime_v5.py \
            scripts/fix_tool_runtime_v5.py \
            scripts/patch_tool_runtime_v5_for_main.py
          git config user.name "cambium-tools-bot"
          git config user.email "cambium-tools-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(tools): complete immutable hybrid tool runtime"
          git push --force-with-lease=refs/heads/main:${BASE_SHA} origin HEAD:main
