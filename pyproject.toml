[project]
name = "cambium"
version = "0.1.0"
description = "Multi-agent coding-agent harness"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cambium"]

[tool.pytest.ini_options]
testpaths = ["tests"]
