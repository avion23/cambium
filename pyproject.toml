[project]
name = "cambium"
version = "0.1.0"
description = "Multi-agent coding-agent harness"
readme = "README.md"
requires-python = ">=3.14"
# pytest is a runtime dependency: `cambium bench` and `cambium module-test`
# import pytest (bench.py, module_conformance.py) in a plain wheel install.
dependencies = ["pytest>=9"]

[project.scripts]
cambium = "cambium.cli:main"

[project.entry-points.pytest11]
"cambium.bench" = "cambium.bench"
"cambium.module_conformance" = "cambium.module_conformance"

[project.optional-dependencies]
# ast: focused alias for consumers that need only the optional tree-sitter
# Python parser; the stdlib ast backend remains the core fallback.
ast = ["tree-sitter>=0.26", "tree-sitter-python>=0.25"]
# test: what CI runs — the AST backend on top of the runtime pytest dependency.
test = ["tree-sitter>=0.26", "tree-sitter-python>=0.25"]
# dev: superset of test — everything a contributor needs locally. Keep the
# AST dependencies here as well so `--extra dev` exercises the same backend.
# ruff>=0.12, not ruff>=0.9: ruff<0.12 rejects `target-version = "py314"`
# (verified 0.9.10/0.11.0: "unknown variant `py314`"); 0.12.0 accepts it.
dev = [
    "ruff>=0.12",
    "tree-sitter>=0.26",
    "tree-sitter-python>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cambium"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
