[project]
name = "cambium"
version = "0.1.0"
description = "Multi-agent coding-agent harness"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.entry-points.pytest11]
"cambium.bench" = "cambium.bench"

[project.optional-dependencies]
# test: what CI runs — pytest only.
test = ["pytest>=9"]
# dev: superset of test — everything a contributor needs locally.
# ruff>=0.12, not ruff>=0.9: ruff<0.12 rejects `target-version = "py314"`
# (verified 0.9.10/0.11.0: "unknown variant `py314`"); 0.12.0 accepts it.
dev = ["pytest>=9", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cambium"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
