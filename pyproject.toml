[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cambium"
version = "0.1.0"
description = "Multi-agent coding-agent harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
cambium = "cambium.cli:main"
cambium-monitor = "cambium.monitor:main"

[project.optional-dependencies]
dspy = ["dspy>=3.3.0,<3.4"]
# ast: focused alias for consumers that need only the optional tree-sitter
# Python parser; the stdlib ast backend remains the core fallback.
ast = ["tree-sitter>=0.26", "tree-sitter-python>=0.25"]
# test: what the local test harness runs, including commands that use the pytest-based harness.
# dspy is pinned here (and in dev) so the default isolated test install runs
# the CambiumLM scenarios instead of skipping 113 tests.
test = [
    "pytest>=9",
    "pytest-xdist>=3.6",
    "tree-sitter>=0.26",
    "tree-sitter-python>=0.25",
    "dspy>=3.3.0,<3.4",
]
# dev: superset of test — everything a contributor needs locally. Keep the
# AST dependencies here as well so `--extra dev` exercises the same backend.
# ruff>=0.12, not ruff>=0.9: ruff<0.12 rejects `target-version = "py314"`
# (verified 0.9.10/0.11.0: "unknown variant `py314`"); 0.12.0 accepts it.
# Ruff 0.15+ formatter corrupts valid `except (A, B):` into syntactically-invalid
# Python 2 syntax (canary-verified against fresh PyPI wheels; 0.12.0 is clean).
# pytest-xdist powers `pytest -n auto` for the parallel tiers (verified: the
# whole suite is xdist-safe; slow tier 92s -> ~35s on 4 cores).
dev = [
    "pytest>=9",
    "ruff>=0.12,<0.15",
    "tree-sitter>=0.26",
    "tree-sitter-python>=0.25",
    "dspy>=3.3.0,<3.4",
    "pytest-xdist>=3.6",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src"]
# Default run is the fast tier: subprocess/process-boundary integration
# scenarios opt out via the `slow` marker and run with `pytest -m slow`.
# The suite uses tmp_path for filesystem state and ephemeral loopback ports.
# The two provider timing modules are kept together by the root conftest hook:
# their sub-second deadline assertions can be starved by load scheduling even
# though their state is otherwise hermetic.  loadgroup preserves that boundary
# while keeping the remaining tests distributed across workers.
addopts = "-m 'not slow' -n auto --dist=loadgroup"
markers = [
    "slow: subprocess/process-boundary integration scenario; run with -m slow",
    "acceptance: opt-in live-provider acceptance; requires explicit credentials and config",
    "xdist_group(name): keep timing-sensitive provider scenarios on one worker",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
